<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Random-Entry-Demo</title>
  </head>

  <body>
    <div id="app"></div>

    <!-- Zufälliger Einstieg -->
    <script type="module">
      // alle Dateien, die main*.js heißen, einsammeln
      const modules = import.meta.glob('./main*.js');

      // Schlüssel (= Pfadnamen) in ein Array umwandeln
      const keys = Object.keys(modules);

      // Zufällig einen Pfad wählen
      const pick = keys[Math.floor(Math.random() * keys.length)];

      // Gewähltes Modul laden & ausführen
      modules[pick]().catch(console.error);
    </script>
  </body>
</html>
